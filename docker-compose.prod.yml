# Production Docker Compose file for FSocial
# This file uses images from Docker Hub instead of building locally
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # Account Service
  accountservice:
    container_name: ${ACCOUNT_SERVICE}
    restart: unless-stopped
    image: ${DOCKER_REGISTRY:-cangngo}/fsocial-accountservice:${VERSION:-latest}
    environment:
      - PROFILE_SERVICE_URL=${PROFILE_SERVICE_URL}
      - EMAIL_APP=${EMAIL_APP}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_PORT=${EMAIL_PORT}
      - MYSQL_URL=${MYSQL_URL}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CONTAINER=${REDIS_CONTAINER}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - RESEND_MAIL_FROM=${RESEND_MAIL_FROM}
      - RESEND_HOST=${RESEND_HOST}
      - RESEND_PORT=${RESEND_PORT}
      - RESEND_NAME=${RESEND_NAME}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - FRONT_END=${FRONT_END}
      - RABBITMQ_HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
    ports:
      - "${ACCOUNT_PORT}:${ACCOUNT_PORT}"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${ACCOUNT_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Message Service
  messageservice:
    container_name: ${MESSAGE_SERVICE}
    restart: unless-stopped
    image: ${DOCKER_REGISTRY:-cangngo}/fsocial-messageservice:${VERSION:-latest}
    environment:
      - MONGODB_MESSAGE_URL=${MONGODB_MESSAGE_URL}
      - REDIS_USER=${REDIS_USER}
      - REDIS_CONTAINER=${REDIS_CONTAINER}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      - PROFILE_SERVICE_URL=${PROFILE_SERVICE_URL}
      - ACCOUNT_SERVICE_URL=${ACCOUNT_SERVICE_URL}
      - RABBITMQ_HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
    ports:
      - "${MESSAGE_PORT}:${MESSAGE_PORT}"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MESSAGE_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Notification Service
  notificationservice:
    container_name: ${NOTIFICATION_SERVICE}
    restart: unless-stopped
    image: ${DOCKER_REGISTRY:-cangngo}/fsocial-notificationservice:${VERSION:-latest}
    environment:
      - PROFILE_SERVICE_URL=${PROFILE_SERVICE_URL}
      - MONGODB_NOTIFICATION_URL=${MONGODB_NOTIFICATION_URL}
      - NOTIFICATION_SERVICE_URL_SOCKET=${NOTIFICATION_SERVICE_URL_SOCKET}
      - REDIS_USER=${REDIS_USER}
      - REDIS_CONTAINER=${REDIS_CONTAINER}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      - RABBITMQ_HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
    ports:
      - "${NOTIFICATION_PORT}:${NOTIFICATION_PORT}"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NOTIFICATION_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Post Service
  postservice:
    container_name: ${POST_SERVICE}
    restart: unless-stopped
    image: ${DOCKER_REGISTRY:-cangngo}/fsocial-postservice:${VERSION:-latest}
    environment:
      - ACCOUNT_SERVICE_URL=${ACCOUNT_SERVICE_URL}
      - PROFILE_SERVICE_URL=${PROFILE_SERVICE_URL}
      - MONGODB_POST_URL=${MONGODB_POST_URL}
      - REDIS_USER=${REDIS_USER}
      - REDIS_CONTAINER=${REDIS_CONTAINER}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RABBITMQ_HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
    ports:
      - "${POST_PORT}:${POST_PORT}"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${POST_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Profile Service
  profileservice:
    container_name: ${PROFILE_SERVICE}
    restart: unless-stopped
    image: ${DOCKER_REGISTRY:-cangngo}/fsocial-profileservice:${VERSION:-latest}
    environment:
      - ACCOUNT_SERVICE_URL=${ACCOUNT_SERVICE_URL}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL}
      - POST_SERVICE_URL=${POST_SERVICE_URL}
      - NEO4J_URL=${NEO4J_URL}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CONTAINER=${REDIS_CONTAINER}
      - REDIS_PORT=${REDIS_PORT}
      - RABBITMQ_HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
    ports:
      - "${PROFILE_PORT}:${PROFILE_PORT}"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PROFILE_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Relationship Service
  relationshipservice:
    container_name: ${RELATIONSHIP_SERVICE}
    restart: unless-stopped
    image: ${DOCKER_REGISTRY:-cangngo}/fsocial-relationshipservice:${VERSION:-latest}
    environment:
      - PROFILE_SERVICE_URL=${PROFILE_SERVICE_URL}
      - NEO4J_URL=${NEO4J_URL}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CONTAINER=${REDIS_CONTAINER}
      - REDIS_PORT=${REDIS_PORT}
      - RABBITMQ_HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
    ports:
      - "${RELATIONSHIP_PORT}:${RELATIONSHIP_PORT}"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${RELATIONSHIP_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Timeline Service
  timelineservice:
    container_name: ${TIMELINE_SERVICE}
    restart: unless-stopped
    image: ${DOCKER_REGISTRY:-cangngo}/fsocial-timelineservice:${VERSION:-latest}
    environment:
      - PROFILE_SERVICE_URL=${PROFILE_SERVICE_URL}
      - POST_SERVICE_URL=${POST_SERVICE_URL}
      - MONGODB_TIMELINE_URL=${MONGODB_TIMELINE_URL}
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CONTAINER=${REDIS_CONTAINER}
      - REDIS_PORT=${REDIS_PORT}
      - RABBITMQ_HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
    ports:
      - "${TIMELINE_PORT}:${TIMELINE_PORT}"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${TIMELINE_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # API Gateway
  apigateway:
    container_name: ${API_GATEWAY}
    image: ${DOCKER_REGISTRY:-cangngo}/fsocial-apigateway:${VERSION:-latest}
    restart: unless-stopped
    environment:
      - SPRING_APPLICATION_ACTIVE=pro
      - GATEWAY_PORT=${GATEWAY_PORT}
      - ACCOUNT_SERVICE_URL=${ACCOUNT_SERVICE_URL}
      - PROFILE_SERVICE_URL=${PROFILE_SERVICE_URL}
      - POST_SERVICE_URL=${POST_SERVICE_URL}
      - MESSAGE_SERVICE_URL=${MESSAGE_SERVICE_URL}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL}
      - REDIS_USER=${REDIS_USER}
      - REDIS_CONTAINER=${REDIS_CONTAINER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - RABBITMQ_HOSTNAME=${RABBITMQ_HOSTNAME}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${GATEWAY_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - accountservice
      - messageservice
      - notificationservice
      - postservice
      - profileservice

networks:
  app_network:
    driver: bridge
    name: fsocial_network

